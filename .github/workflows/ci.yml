name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff mypy
      - run: ruff check evoker/src hosts/python/src
      - run: mypy evoker/src hosts/python/src --ignore-missing-imports

  install_test:
    name: Test Install Sequence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install ./evoker
          pip install ./hosts/python
          python -c "import evoker; import evoker_client"

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./evoker"
          pip install -e "./hosts/python[dev]"

      - name: Run Python tests
        run: |
          pytest hosts/python/tests --cov=evoker --cov=evoker_client --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Run Rust tests
        run: |
          cd hosts/rust
          cargo test

      - name: Build C++ tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S hosts/cpp -B hosts/cpp/build -DCMAKE_BUILD_TYPE=Debug -DEVOKER_TEST_ASSETS="${{ github.workspace }}/test_assets"
          cmake --build hosts/cpp/build
          cd hosts/cpp/build
          ctest --output-on-failure -C Debug --timeout 90

      - name: Build C++ tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S hosts/cpp -B hosts/cpp/build -DEVOKER_TEST_ASSETS="${{ github.workspace }}/test_assets"
          cmake --build hosts/cpp/build --config Debug
          cd hosts/cpp/build
          ctest --output-on-failure -C Debug --timeout 90

      - name: Build C tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S hosts/c -B hosts/c/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build hosts/c/build
          cd hosts/c/build
          ctest --output-on-failure -C Debug --timeout 90

      - name: Build C tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S hosts/c -B hosts/c/build
          cmake --build hosts/c/build --config Debug
          cd hosts/c/build
          ctest --output-on-failure -C Debug --timeout 90

  test_slow:
    name: Slow Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -e "./evoker"
          pip install -e "./hosts/python[dev]"
      - run: pytest hosts/python/tests -m slow

  release:
    name: Build Release Binaries
    runs-on: windows-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -e "./evoker"
          pip install -e "./hosts/python[dev]"
          python hosts/python/dev.py build-release
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: evoker-windows-release
          path: hosts/python/dist/host.exe
