name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis
          pip install -e ./hosts/python

      - name: Run Python tests
        run: |
          cd hosts/python
          pytest tests

      - name: Run Rust tests
        run: |
          cd hosts/rust
          cargo test

      - name: Build C++ tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S hosts/cpp -B hosts/cpp/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build hosts/cpp/build
          ./hosts/cpp/build/integration_test
          ./hosts/cpp/build/cpp_unit_tests
          ./hosts/cpp/build/cpp_fuzz_test
          ./hosts/cpp/build/cpp_error_test

      - name: Build C++ tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S hosts/cpp -B hosts/cpp/build
          cmake --build hosts/cpp/build --config Debug
          .\hosts\cpp\build\Debug\integration_test.exe
          .\hosts\cpp\build\Debug\cpp_unit_tests.exe
          .\hosts\cpp\build\Debug\cpp_fuzz_test.exe
          .\hosts\cpp\build\Debug\cpp_error_test.exe

      - name: Build C tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S hosts/c -B hosts/c/build -DCMAKE_BUILD_TYPE=Debug
          cmake --build hosts/c/build
          ./hosts/c/build/c_integration_test
          ./hosts/c/build/c_error_test

      - name: Build C tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S hosts/c -B hosts/c/build
          cmake --build hosts/c/build --config Debug
          .\hosts\c\build\Debug\c_integration_test.exe
          .\hosts\c\build\Debug\c_error_test.exe
